# Based on the official example (2026-11-17):
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-filtered-authors.yml
# Changes: label-activated review, maintainer-only, subscription auth, run caps, no uv.

name: Claude Review

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  review-on-demand:
    # Review on demand only: the PR must carry the "claude-review" label.
    if: |
      github.event.pull_request.user.login == 'berthetclement' &&
      contains(github.event.pull_request.labels.*.name, 'claude-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude-Review PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Note: The PR branch is already checked out in the current working directory.

            Review this pull request against the "Code review" section of CLAUDE.md.

            Post the review with `gh pr comment`; use inline comments for
            line-specific points. If nothing is worth raising, post one short
            comment saying so. Never finish without posting.

          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"